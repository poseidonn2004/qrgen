<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>QR Thanh Toán</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
<h2>QR Thanh Toán</h2>

<!-- CHỌN TÀI KHOẢN -->
<div class="account-cards">
  <div class="account-card active"
   data-account="https://img.vietqr.io/image/vietcombank-1054634288-print.jpg">
    <div class="bank-name">Vietcombank</div>
    <div class="bank-number">1054634288</div>
    <div class="bank-name">NGUYEN THI NGAN</div>
  </div>
  <div class="account-card"
   data-account="https://img.vietqr.io/image/vietcombank-7770319999-print.jpg">
    <div class="bank-name">Vietcombank</div>
    <div class="bank-number">7770319999</div>
    <div class="bank-name">Công Ty TNHH Thương Mại Và Dịch Vụ XVIP</div>
  </div>

  
</div>

<label><b>Số tiền (VND)</b></label>
<input
  id="amount"
  type="text"
  placeholder="Số tiền"
  inputmode="numeric"
/>

<label>Nội dung chuyển khoản</label>
<input id="content" type="text" placeholder="VD: Thanh toan">

<button id="generate">Tạo QR</button>
<button id="copy-qr" disabled>📋 Copy QR</button>

<div id="qr-container">
  <img id="qr-img">
</div>

<script src="popup.js"></script>
</div>
</body>
</html>
